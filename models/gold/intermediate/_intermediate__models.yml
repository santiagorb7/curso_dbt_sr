# int_order_items__priced no aparece aquí: es ephemeral y no admite data tests.
models:
  - name: int_orders__enriched
    description: Pedidos enriquecidos con dirección y promoción. Grano pedido.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_events__pivoted_by_session
    description: Contadores de eventos por tipo. Grano (user_id, session_id).
    # Día 8: la carpeta intermediate es private del group core, pero este
    # modelo solo lo usa Producto (agg_user_sessions): lo movemos a su group.
    config:
      group: product
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, session_id]
